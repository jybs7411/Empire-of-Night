<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>밤의 균형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>

  <div class="gauges" aria-label="위압, 견제, 불안">
    <button type="button" class="g dread" id="gDread" data-g="dread">
      <div class="g-head"><span class="gn">위압</span><span class="gv"><em class="delta"></em><b>0</b></span></div>
      <div class="g-track"><span class="zone bad" style="left:0;width:28%"></span><span class="zone warn" style="left:55%;width:45%"></span><span class="fill"></span><span class="pin"></span></div>
    </button>
    <button type="button" class="g heat" id="gHeat" data-g="heat">
      <div class="g-head"><span class="gn">견제</span><span class="gv"><em class="delta"></em><b>0</b></span></div>
      <div class="g-track"><span class="zone warn" id="zHeatW" style="left:55%;width:15%"></span><span class="zone bad" id="zHeatB" style="left:70%;width:30%"></span><span class="fill"></span><span class="pin"></span></div>
    </button>
    <button type="button" class="g anx" id="gAnx" data-g="anx">
      <div class="g-head"><span class="gn">불안</span><span class="gv"><em class="delta"></em><b>0</b></span></div>
      <div class="g-track"><span class="zone warn" style="left:60%;width:10%"></span><span class="zone bad" style="left:70%;width:30%"></span><span class="fill"></span><span class="pin"></span></div>
    </button>
  </div>

  <div class="tick" id="tick"></div>

  <div class="mapwrap" id="mapwrap"><div id="map"></div><svg id="fx" viewBox="-12 -12 444 502" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>

  <div class="info" id="info"></div>

  <div class="dock" id="dock">
    <button type="button" class="act" id="bRecruit"><b>모집</b><small>+2명 · ¥5</small></button>
    <button type="button" class="act danger" id="bExample" aria-pressed="false"><b>본보기</b><small>위압 +14</small></button>
    <button type="button" class="act" id="bFeast"><b>연회</b><small>위압 +10 · ¥10</small></button>
    <button type="button" class="act" id="bLie"><b>숨 죽이기</b><small>견제 −10</small></button>
  </div>

  <div class="row2">
    <div class="seg" id="amt" role="group" aria-label="보내는 병력">
      <button type="button" data-amt="all" aria-pressed="true">전부</button>
      <button type="button" data-amt="half" aria-pressed="false">절반</button>
    </div>
    <button type="button" class="sbtn" id="bDrink">술자리</button>
    <button type="button" class="sbtn" id="bUndo">되돌리기</button>
    <button type="button" class="primary" id="bEnd">밤을 넘긴다</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button type="button" class="tab" data-tab="crew" aria-expanded="false">부하<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="tech" aria-expanded="false">강화<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="rivals" aria-expanded="false">이웃<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="log" aria-expanded="false">기록<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="more" aria-expanded="false">더보기<span class="nd" hidden></span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><h2 id="shTitle"></h2><button type="button" class="x" id="shClose">닫기</button></div>
  <div id="shBody"></div>
</section>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="recap" id="recap" role="dialog" aria-live="polite" hidden></div>

<!-- 스크립트는 번호 순서대로 로드해야 함 (전역 스코프 공유) -->
<script src="js/01-core.js"></script>
<script src="js/02-map-gen.js"></script>
<script src="js/03-ui-setup.js"></script>
<script src="js/04-hud.js"></script>
<script src="js/05-map-render.js"></script>
<script src="js/06-info-dock.js"></script>
<script src="js/07-combat-fx.js"></script>
<script src="js/08-art.js"></script>
<script src="js/09-sheets.js"></script>
<script src="js/10-events.js"></script>
<script src="js/11-actions.js"></script>
<script src="js/12-input.js"></script>
<script src="js/13-boot.js"></script>
</body>
</html>
