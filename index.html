<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>밤의 균형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button type="button" class="gear" id="bGear" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zM10.3 2.6h3.4l.5 2.4c.6.2 1.1.5 1.6.9l2.3-.8 1.7 2.9-1.8 1.6c.1.6.1 1.2 0 1.8l1.8 1.6-1.7 2.9-2.3-.8c-.5.4-1 .7-1.6.9l-.5 2.4h-3.4l-.5-2.4c-.6-.2-1.1-.5-1.6-.9l-2.3.8-1.7-2.9 1.8-1.6a6 6 0 0 1 0-1.8L4.2 8.8l1.7-2.9 2.3.8c.5-.4 1-.7 1.6-.9z"/></svg></button>
    <div class="hud" id="top"></div>
    <button type="button" class="datebox" id="dateBox" aria-label="밤 진행"></button>
  </header>

  <div class="chips" id="chips"></div>

  <div class="mapwrap" id="mapwrap">
    <div class="stage" id="stage">
      <div id="map"><svg id="ovl" viewBox="-12 -12 444 504" preserveAspectRatio="xMidYMid meet" role="group" aria-label="지도"></svg></div>
      <svg id="fx" viewBox="-12 -12 444 504" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </div>
    <aside class="meters" id="meters" aria-label="위세, 경계, 동요">
      <button type="button" class="mt dread" id="gDread" data-g="dread">
        <b class="mv">0</b><em class="delta"></em>
        <span class="mtrack"><span class="zone bad"></span><span class="zone warn"></span><span class="fill"></span></span>
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V6.5a1.6 1.6 0 0 1 3.2 0V10m0-4.2a1.6 1.6 0 0 1 3.2 0V10m0-3a1.6 1.6 0 0 1 3.2 0v4.2m0-1.6a1.6 1.6 0 0 1 3.2 0V14c0 4-2.4 6.8-6.4 6.8-3.6 0-5.2-1.8-7-4.6L3.6 13a1.6 1.6 0 0 1 2.6-1.8L7 12.6"/></svg>
        <span class="mn">위세</span>
      </button>
      <button type="button" class="mt heat" id="gHeat" data-g="heat">
        <b class="mv">0</b><em class="delta"></em>
        <span class="mtrack"><span class="zone warn" id="zHeatW"></span><span class="zone bad" id="zHeatB"></span><span class="fill"></span></span>
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
        <span class="mn">경계</span>
      </button>
      <button type="button" class="mt anx" id="gAnx" data-g="anx">
        <b class="mv">0</b><em class="delta"></em>
        <span class="mtrack"><span class="zone warn"></span><span class="zone bad"></span><span class="fill"></span></span>
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5c2.4-1.2 4.5-1.6 7-1.6s4.6.4 7 1.6v6.2c0 4.4-3 7.4-7 8.8-4-1.4-7-4.4-7-8.8z"/><path d="M12 4l-1.4 5 2.4 2.2-2 3.2 1.2 4"/></svg>
        <span class="mn">동요</span>
      </button>
    </aside>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <button type="button" class="advisor" id="advisor"></button>
  <div class="info" id="info"></div>

  <div class="dock" id="dock">
    <button type="button" class="act" id="bRecruit"><b>모집</b><small>병력 +2 · ¥5</small></button>
    <button type="button" class="act danger" id="bExample" aria-pressed="false"><b>본보기</b><small>위세+14 경계+9</small></button>
    <button type="button" class="act" id="bFeast"><b>연회</b><small>위세+10 · ¥10</small></button>
    <button type="button" class="act" id="bLie"><b>숨 죽이기</b><small>경계−10 동요−6</small></button>
  </div>

  <div class="row2">
    <button type="button" class="sbtn undo" id="bUndo" aria-label="되돌리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16M5 11.5h9.5a4.5 4.5 0 0 1 0 9H12"/></svg></button>
    <div class="seg" id="amt" role="group" aria-label="보내는 병력">
      <button type="button" data-amt="all" aria-pressed="true">전부</button>
      <button type="button" data-amt="half" aria-pressed="false">절반</button>
    </div>
    <button type="button" class="autob" id="bAuto" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"></svg><b>알아서</b></button>
    <button type="button" class="primary" id="bEnd">밤을 넘긴다</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button type="button" class="tab" data-tab="ops" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11zM9 20v-6h6v6"/></svg>작전실<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="dip" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.5l4-4 3.2 1.6 3-2.2 4.4 2.6 2.4-1.6 2 2.4-6.6 6.2-2.4-1.4-2.2 1.4z"/></svg>외교<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="crew" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.8 3-6 7-6s7 2.2 7 6z"/></svg>부하<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="log" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20.5H6zM9 10h6M9 13.5h6M9 17h4"/></svg>기록<span class="nd" hidden></span></button>
    <button type="button" class="tab" data-tab="more" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>더보기<span class="nd" hidden></span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><h2 id="shTitle"></h2><button type="button" class="x" id="shClose">닫기</button></div>
  <div id="shBody"></div>
</section>
<section class="ops" id="ops" role="dialog" aria-modal="true" aria-label="작전실" hidden>
  <div class="ops-tabs" id="opsTabs"></div>
  <div class="ops-body" id="opsBody"></div>
  <div class="ops-foot" id="opsFoot"></div>
</section>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="recap" id="recap" role="dialog" aria-live="polite" hidden></div>

<!-- 스크립트는 번호 순서대로 로드해야 함 (전역 스코프 공유) -->
<script src="js/01-core.js"></script>
<script src="js/01a-diplomacy.js"></script>
<script src="js/01b-auto.js"></script>
<script src="js/02-map-gen.js"></script>
<script src="js/03-ui-setup.js"></script>
<script src="js/04-hud.js"></script>
<script src="js/05-map-render.js"></script>
<script src="js/06-info-dock.js"></script>
<script src="js/07-combat-fx.js"></script>
<script src="js/08-art.js"></script>
<script src="js/09-sheets.js"></script>
<script src="js/10-events.js"></script>
<script src="js/11-actions.js"></script>
<script src="js/12-input.js"></script>
<script src="js/12a-auto-ui.js"></script>
<script src="js/13-boot.js"></script>
</body>
</html>
